<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parquímetro Digital</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-grid"></div>

  <main class="container">
    <header class="header">
      <div class="icon-wrap">
        <svg width="38" height="38" viewBox="0 0 38 38" fill="none">
          <circle cx="19" cy="19" r="18" stroke="var(--accent)" stroke-width="2"/>
          <rect x="15" y="7" width="8" height="16" rx="4" fill="var(--accent)"/>
          <rect x="17" y="23" width="4" height="8" rx="2" fill="var(--accent)"/>
        </svg>
      </div>
      <div>
        <h1 class="title">Parquímetro</h1>
        <p class="subtitle">Sistema Digital de Estacionamento</p>
      </div>
    </header>

    <div class="card">
      <label class="label" for="valor">Valor inserido (R$)</label>
      <div class="input-row">
        <span class="prefix">R$</span>
        <input
          type="number"
          id="valor"
          class="input"
          placeholder="0,00"
          min="0"
          step="0.01"
        />
      </div>
      <div class="hints">
        <button class="hint-btn" data-val="1.00">R$ 1,00</button>
        <button class="hint-btn" data-val="1.75">R$ 1,75</button>
        <button class="hint-btn" data-val="3.00">R$ 3,00</button>
      </div>
      <button class="btn" id="calcular">Calcular Tempo</button>
    </div>

    <div class="result-card" id="resultado" aria-live="polite"></div>

    <div class="tabela-card">
      <h2 class="tabela-titulo">Tabela de Tarifas</h2>
      <table class="tabela">
        <thead>
          <tr>
            <th>Valor</th>
            <th>Tempo</th>
          </tr>
        </thead>
        <tbody>
          <tr><td>R$ 1,00</td><td>30 minutos</td></tr>
          <tr><td>R$ 1,75</td><td>60 minutos</td></tr>
          <tr class="max-row"><td>R$ 3,00</td><td>120 min <span class="badge">máx</span></td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script src="scripts.js"></script>
</body>
</html>
